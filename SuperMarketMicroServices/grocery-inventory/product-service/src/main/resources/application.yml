spring:
  application:
    name: "product-service"
  datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8082

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.priceman.categoryservice: DEBUG  # adjust package name
    com.priceman.productservice: DEBUG   # adjust package name
  file:
    name: logs/app.log