spring.application.name=supermarket

# Server configuration
server.port=8080
server.servlet.context-path=/api
# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/supermarket_db
#spring.datasource.url=jdbc:postgresql://supermarket-postgres:5432/supermarket_db
spring.datasource.username=supermarket_user
spring.datasource.password=supermarket_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Logging configuration
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
# Security configuration
spring.security.user.name=admin
spring.security.user.password=admin123
# CORS configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# Cache configuration
spring.cache.type=simple

# Actuator configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
